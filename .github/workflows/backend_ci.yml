name: backend_ci

on:
  workflow_dispatch:
  push:
    branches: [dynamic-site]
  pull_request:
    branches: [dynamic-site]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Run backend tests
        run: bundle exec ruby -Iserver/lib:test -e 'Dir["test/server/*_test.rb"].sort.each { |file| require_relative file }'

      - name: Build dynamic server site
        run: bin/build-dynamic

      - name: Verify backend files are excluded from site output
        run: |
          test ! -e _site/server
          test ! -e _site/admin
          test ! -e _site/deploy
          test ! -e _site/test
